services:
  sshkube-server:
    build:
      context: server
      platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    image: u8sand/sshkube-server:0.1.2
    configs:
      - source: github-users
        target: /data/users
    ports:
      - 22/tcp
    volumes:
      - sshkube-server-hostkeys:/data/ssh-host-keys

volumes:
  sshkube-server-hostkeys:

configs:
  github-users:
    content: |
      u8sand
